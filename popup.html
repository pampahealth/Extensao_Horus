<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Coletor Universal</title>
  <style>
    body {
      width: 500px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    
    button {
      margin: 5px;
      padding: 8px 15px;
      cursor: pointer;
    }
    
    #resultado {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      overflow: auto;
    }
    
    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    
    .modal-header h2 {
      margin: 0;
      color: #333;
    }
    
    .close {
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      line-height: 20px;
    }
    
    .close:hover,
    .close:focus {
      color: #000;
    }
    
    .dados-container {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
      margin-top: 10px;
    }
    
    .dados-container pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 12px;
      line-height: 1.5;
    }
    
    .status-sucesso {
      color: #28a745;
      font-weight: bold;
      margin-top: 15px;
      padding: 10px;
      background: #d4edda;
      border-radius: 5px;
    }
    
    .status-erro {
      color: #dc3545;
      font-weight: bold;
      margin-top: 15px;
      padding: 10px;
      background: #f8d7da;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h3>Coletor Universal</h3>

  <button id="coletar">Coletar dados</button>
  <button id="salvar">Salvar no banco</button>
  <button id="salvarJson">Salvar como JSON</button>
  <button id="limpar">Limpar coleta</button>

  <pre id="resultado">Aguardando coleta...</pre>

  <!-- Modal para mostrar dados coletados -->
  <div id="modalDados" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Dados Coletados</h2>
        <span class="close">&times;</span>
      </div>
      <div id="modalBody">
        <div class="dados-container">
          <pre id="modalDadosConteudo"></pre>
        </div>
        <div id="modalStatus"></div>
      </div>
    </div>
  </div>

  <script src="supabase.min.js"></script>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
