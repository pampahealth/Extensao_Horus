<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Teste local — Coleta Hórus</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
    button { padding: 10px 16px; font-size: 14px; cursor: pointer; margin-right: 8px; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; max-height: 420px; font-size: 12px; }
    .ok { color: #0a7; font-weight: 600; }
    .err { color: #c00; font-weight: 600; }
    #mock { border: 1px solid #ccc; padding: 12px; margin: 16px 0; background: #fafafa; }
    label { display: block; margin-top: 8px; font-size: 13px; }
    input, textarea { width: 100%; max-width: 480px; }
  </style>
</head>
<body>
  <h1>Teste local da coleta (sem extensão)</h1>
  <p>
    Esta página simula o formulário do Hórus e carrega o mesmo
    <code>coleta-horus.js</code> da extensão. Use antes de instalar no Chromium.
  </p>

  <div id="mock">
    <table id="navegacao"><tr>
      <td>Operador: TESTE LOCAL</td>
      <td>Estabelecimentos de Saúde: CAF ACEGUÁ</td>
    </tr></table>

    <form id="dispensacaoForm">
      <label>Cartão SUS
        <input id="dispensacaoForm:nuCartaoSus" value="700005452554607" />
      </label>
      <input type="hidden" id="dispensacaoForm:coPaciente" value="12421045" />
      <label>Nome
        <input id="dispensacaoForm:noNome" value="JOAO TESTE" />
      </label>
      <label>Nascimento
        <input id="dispensacaoForm:dtNascimento" value="01/01/1990" />
      </label>
      <label>Observação
        <textarea id="dispensacaoForm:dsObservacao">teste local</textarea>
      </label>
      <label>CRM (hidden)
        <input type="hidden" id="dispensacaoForm:coCrmMedico" value="1332064" />
      </label>
      <label>Médico
        <input id="dispensacaoForm:medico" value="TESTE" />
      </label>
      <label>Receita
        <input id="dispensacaoForm:nuReceita" value="12345" />
      </label>
      <label>Data receita
        <input id="dispensacaoForm:dtReceitaInputDate" value="08/01/2026" />
      </label>

      <table id="dispensacaoForm:itens">
        <tr>
          <td>
            <textarea id="dispensacaoForm:itens:0:item_produto_dsProduto">BR0436237-CARISOPRODOL + PARACETAMOL 300+100 MG CÁPSULA</textarea>
            <input type="hidden" id="dispensacaoForm:itens:0:item_produto_coSeqProduto" value="46451" />
            <input id="dispensacaoForm:itens:0:item_qtDose" value="1,00" />
            <input id="dispensacaoForm:itens:0:item_unidadeConsumo" value="CAPS." />
            <input id="dispensacaoForm:itens:0:item_qtPosologia" value="2" />
            <input id="dispensacaoForm:itens:0:item_qtDuracaoTratamDia" value="5" />
            <input id="dispensacaoForm:itens:0:item_nuDiasDispensar" value="5" />
          </td>
        </tr>
      </table>
    </form>
  </div>

  <button id="btnColetar" type="button">Testar coleta</button>
  <button id="btnAbrirSnapshot" type="button">Abrir SiteHorus.html (snapshot)</button>
  <p id="status"></p>
  <pre id="out">Clique em “Testar coleta”…</pre>

  <script src="coleta-horus.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    document.getElementById("btnColetar").onclick = () => {
      try {
        if (typeof window.__coletorHorusColetar !== "function") {
          throw new Error("coleta-horus.js não carregou");
        }
        // Força hostname “Hórus” no teste visual (file:// não tem esse host)
        const coleta = window.__coletorHorusColetar();
        statusEl.className = "ok";
        statusEl.textContent = "OK — coleta retornou dados.";
        outEl.textContent = JSON.stringify(coleta, null, 2);
      } catch (e) {
        statusEl.className = "err";
        statusEl.textContent = "FALHA: " + e.message;
        outEl.textContent = String(e.stack || e);
      }
    };

    document.getElementById("btnAbrirSnapshot").onclick = () => {
      window.open("SiteHorus.html", "_blank");
    };
  </script>
</body>
</html>
